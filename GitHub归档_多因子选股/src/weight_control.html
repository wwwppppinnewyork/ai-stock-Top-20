<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多因子权重设置</title>
  <style>
    :root{--ink:#172033;--teal:#0f6268;--green:#078541;--red:#c51f2d;--line:#d7dfdd;--paper:#fbfaf7;--card:#fff;--soft:#edf3f1}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:700 12px/1.45 "Microsoft YaHei",sans-serif}
    header{background:linear-gradient(115deg,#1c2c3b,#23686b);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    h1{font-size:28px;margin:0 0 4px}.sub{opacity:.82}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:9px 15px;border-radius:8px;white-space:nowrap}
    main{max-width:1260px;margin:22px auto;padding:0 22px 42px}.intro{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:16px}.intro h2{font-size:18px;margin:0}.hint{color:#657083}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 18px #14383b0b}.wide{grid-column:1/-1}
    .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.card h3{font-size:17px;margin:0}.sum{padding:4px 9px;border-radius:999px;background:var(--soft);color:var(--teal)}.sum.bad{background:#ffe7e7;color:var(--red)}
    .row{display:grid;grid-template-columns:minmax(190px,1fr) minmax(180px,2fr) 88px;gap:14px;align-items:center;padding:8px 0;border-top:1px solid #edf0ef}.row:first-of-type{border-top:0}.row label{font-size:13px}
    input[type=range]{width:100%;accent-color:var(--teal)}input[type=number]{width:100%;font:900 13px "Microsoft YaHei";padding:8px;border:1px solid #bac8c5;border-radius:7px;text-align:right}
    .actions{position:sticky;bottom:0;margin-top:18px;background:#ffffffed;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 -5px 20px #17203312}.status{min-height:22px}.status.running{color:#8a6500}.status.success{color:var(--green)}.status.failed{color:var(--red)}
    button{border:0;border-radius:9px;background:var(--teal);color:#fff;font:900 14px "Microsoft YaHei";padding:11px 22px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{grid-template-columns:1fr 80px}.row label{grid-column:1/-1}header{align-items:flex-start}.actions{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header><div><h1>多因子权重设置</h1><div class="sub">仅在本机 127.0.0.1 运行 · 保存后使用最新本地数据重排 Top10</div></div><a class="back" href="/">返回网页</a></header>
  <main>
    <div class="intro"><div><h2>调整一级因子与子权重</h2><div class="hint">带“合计”的每组必须等于100%。环比规则系数为独立参数，不要求相加。</div></div></div>
    <div id="cards" class="grid"></div>
    <div class="actions"><div id="status" class="status">正在读取当前配置…</div><button id="save" disabled>保存权重并更新排名</button></div>
  </main>
  <script>
    const definitions=[
      {key:'weights',title:'一级因子权重',wide:true,total:true,items:[['analyst_profit_yoy','分析师预测净利润同比'],['peg','PEG'],['qoq_growth','实际单季度净利润环比'],['consecutive_profit_growth_quarters','最近一期连续增长不中断季度数'],['analyst_net_profit_revision_change','分析师预测变化率'],['quality','ROE／毛利率／净利率']]},
      {key:'profit_yoy_year_weights',title:'盈利同比年度子权重',total:true,items:[['fy1','今年'],['fy2','明年'],['fy3','后年']]},
      {key:'peg_year_weights',title:'PEG年度子权重',total:true,items:[['fy1','今年'],['fy2','明年'],['fy3','后年']]},
      {key:'revision_year_weights',title:'预测变化率年度子权重',total:true,items:[['fy1','今年'],['fy2','明年']]},
      {key:'quality_year_weights',title:'质量因子年度子权重',total:true,items:[['prior','2025年／上年同期'],['current','2026年／当年同期']]},
      {key:'quality_subweights',title:'质量指标子权重（每年内部）',total:true,items:[['roe','ROE'],['gross_margin','毛利率'],['net_margin','净利率']]},
      {key:'qoq_rules',title:'净利润环比规则系数',total:false,items:[['non_full_positive_ratio','未满足连续五季度增长时的系数'],['quarter_cycle_positive_full_ratio','满足连续五季度增长时的系数']]}
    ];
    const cards=document.getElementById('cards'),statusEl=document.getElementById('status'),save=document.getElementById('save');
    let config={};
    const pct=v=>(Number(v)*100).toFixed(2).replace(/\.00$/,'');
    function render(){cards.innerHTML='';definitions.forEach(group=>{const card=document.createElement('section');card.className='card'+(group.wide?' wide':'');card.dataset.group=group.key;card.innerHTML=`<div class="card-head"><h3>${group.title}</h3>${group.total?'<span class="sum"></span>':''}</div>`;group.items.forEach(([key,label])=>{const value=pct(config[group.key][key]);const row=document.createElement('div');row.className='row';row.innerHTML=`<label>${label}</label><input type="range" min="0" max="100" step="0.5" value="${value}" aria-label="${label}"><input type="number" min="0" max="100" step="0.01" value="${value}" aria-label="${label}百分比">`;const range=row.children[1],number=row.children[2];range.oninput=()=>{number.value=range.value;updateModel(group.key,key,number.value)};number.oninput=()=>{range.value=number.value;updateModel(group.key,key,number.value)};card.appendChild(row)});cards.appendChild(card)});updateSums()}
    function updateModel(group,key,value){config[group][key]=Math.max(0,Math.min(100,Number(value)||0))/100;updateSums()}
    function updateSums(){let valid=true;definitions.filter(g=>g.total).forEach(group=>{const total=group.items.reduce((s,[key])=>s+Number(config[group.key][key]||0),0)*100;const badge=document.querySelector(`[data-group="${group.key}"] .sum`);const ok=Math.abs(total-100)<0.01;badge.textContent=`合计 ${total.toFixed(2)}%`;badge.classList.toggle('bad',!ok);valid&&=ok});save.disabled=!valid||statusEl.classList.contains('running')}
    async function readJson(response){let result;try{result=await response.json()}catch(error){throw new Error(`服务返回了无法识别的内容（HTTP ${response.status}）`)}if(!response.ok)throw new Error(result.error||`请求失败（HTTP ${response.status}）`);return result}
    async function load(){const response=await fetch('/api/config',{cache:'no-store'});config=await readJson(response);for(const group of definitions){if(!config[group.key]||typeof config[group.key]!=='object')throw new Error(`配置缺少 ${group.title}`)}render();statusEl.textContent='当前权重已载入';poll()}
    async function submit(){updateSums();if(save.disabled)return;statusEl.className='status running';statusEl.textContent='正在保存并启动更新…';save.disabled=true;try{const response=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});const result=await readJson(response);statusEl.textContent=result.message;poll(true)}catch(error){statusEl.className='status failed';statusEl.textContent=error.message;updateSums()}}
    async function poll(repeat=false){try{const response=await fetch('/api/status',{cache:'no-store'});const result=await readJson(response);statusEl.className='status '+result.status;statusEl.textContent=result.message;if(result.running){save.disabled=true;setTimeout(()=>poll(true),2000)}else{updateSums();if(repeat&&result.status==='success')statusEl.innerHTML=result.message+'　<a href="/dashboard">查看新排名</a>'}}catch(error){if(repeat){statusEl.className='status failed';statusEl.textContent='暂时无法读取更新状态：'+error.message;setTimeout(()=>poll(true),2500)}}}
    save.onclick=submit;load().catch(error=>{statusEl.className='status failed';statusEl.textContent='读取配置失败：'+error.message});
  </script>
</body>
</html>
