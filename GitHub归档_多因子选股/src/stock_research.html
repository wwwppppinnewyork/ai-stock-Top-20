<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI公司研究 · 48项清单</title>
  <style>
    :root{--ink:#172033;--navy:#17365d;--blue:#2f65a7;--teal:#0f6268;--line:#d8e0e8;--paper:#f5f7fa;--card:#fff;--red:#b4232e;--amber:#8a6500;--green:#087b43}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 "Microsoft YaHei",sans-serif}header{background:linear-gradient(120deg,#14283d,#245f7e);color:#fff;padding:24px 30px}header .inner{max-width:1320px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{margin:0;font-size:28px}.sub{opacity:.82;margin-top:4px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff66;padding:8px 14px;border-radius:8px}main{max-width:1320px;margin:22px auto;padding:0 22px 50px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 7px 28px #17365d0c}.search{display:grid;grid-template-columns:minmax(220px,1fr) auto;gap:12px}input{width:100%;border:1px solid #b8c6d4;border-radius:9px;padding:12px 14px;font:700 16px "Microsoft YaHei"}button{border:0;border-radius:9px;background:var(--teal);color:#fff;padding:11px 24px;font:800 15px "Microsoft YaHei";cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.meta{margin-top:10px;color:#677588}.status{margin-top:13px;padding:10px 12px;border-radius:8px;background:#eef4f6}.status.error{background:#ffe9e9;color:var(--red)}.status.running{background:#fff4d5;color:var(--amber)}.status.ok{background:#e9f7ef;color:var(--green)}.history-panel{margin-top:18px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.history-head h2{margin:0;font-size:20px}.history-head button{padding:7px 13px;font-size:13px;background:#657385}.history-list{display:grid;gap:9px;margin-top:12px}.history-empty{color:#778392;padding:8px 0}.history-item{display:grid;grid-template-columns:minmax(190px,1fr) minmax(160px,.8fr) auto;align-items:center;gap:12px;padding:11px 13px;border:1px solid #e0e6ec;border-radius:10px;background:#fafbfd}.history-name{font-size:16px;font-weight:900;color:#111}.history-meta{font-size:12px;color:#6f7884}.history-actions{display:flex;gap:7px}.history-actions button{padding:7px 12px;font-size:12px}.history-actions .rerun{background:#8a6500}.summary{margin-top:18px;padding:18px;border-left:5px solid var(--blue)}.summary h2{margin:0 0 5px}.summary>div:not(.toolbar){color:#000;font-size:18px;line-height:1.8;font-weight:800}.toolbar{display:flex;gap:8px;margin-top:12px}.toolbar button{background:var(--blue);padding:8px 14px;font-size:13px}.results{margin-top:18px;display:grid;gap:14px}.module{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.module h3{margin:0;background:var(--navy);color:#fff;padding:12px 16px;font-size:16px}.row{display:grid;grid-template-columns:42px minmax(230px,1.2fr) minmax(220px,1fr) minmax(300px,1.6fr) 70px;gap:12px;padding:13px 15px;border-top:1px solid #edf0f3;align-items:start}.num{font-weight:900;color:var(--blue)}.question{font-weight:800}.answer{color:#000;font-size:17px;line-height:1.75;font-weight:900}.evidence{color:#6f7884;font-size:12px;line-height:1.5;font-weight:400}.confidence{font-size:13px;font-weight:800;color:#000;text-align:center;border-radius:999px;background:#edf3f7;padding:3px 7px}.confirm{color:var(--amber);font-size:13px;margin-top:4px}.empty{color:#8994a2}.risk{margin-top:16px;color:#171717;font-size:16px;line-height:1.75;font-weight:700;background:#fff7df;border:1px solid #eed592;padding:12px 15px;border-radius:10px}@media(max-width:850px){header .inner{align-items:flex-start}.search{grid-template-columns:1fr}.history-item{grid-template-columns:1fr}.history-actions{justify-content:flex-start}.row{grid-template-columns:34px 1fr}.answer,.evidence,.confidence{grid-column:2}.back{white-space:nowrap}}
  </style>
</head>
<body>
  <header><div class="inner"><div><h1>AI公司研究 · 48项清单</h1><div class="sub">输入股票代码，调用本地 Wind 数据与 OpenAI Responses API 生成结构化研究答案</div></div><a class="back" href="/">返回网页</a></div></header>
  <main>
    <section class="panel">
      <div class="search"><input id="code" placeholder="例如：300308、300308.SZ、NVDA.O" autocomplete="off"><button id="analyze">生成48项答案</button></div>
      <div class="meta">六位A股代码会自动补全交易所后缀。相同代码默认打开最近的本地历史记录，不产生API费用；只有“重新生成（收费）”才会再次调用模型。</div>
      <div id="status" class="status">正在检查本地服务…</div>
    </section>
    <section class="panel history-panel">
      <div class="history-head"><h2>历史记录 <small id="historyCount"></small></h2><button id="refreshHistory">刷新</button></div>
      <div id="historyList" class="history-list"><div class="history-empty">正在读取本地记录…</div></div>
    </section>
    <section id="summary" class="panel summary" hidden></section>
    <div id="results" class="results"></div>
    <div id="risk" class="risk" hidden></div>
  </main>
  <script>
    const code=document.getElementById('code'),analyze=document.getElementById('analyze'),statusEl=document.getElementById('status'),summary=document.getElementById('summary'),results=document.getElementById('results'),risk=document.getElementById('risk'),historyList=document.getElementById('historyList'),historyCount=document.getElementById('historyCount'),refreshHistory=document.getElementById('refreshHistory');let questions=[],lastResult=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function readJson(response){let data;try{data=await response.json()}catch{throw new Error(`服务返回异常（HTTP ${response.status}）`)}if(!response.ok)throw new Error(data.error||`请求失败（HTTP ${response.status}）`);return data}
    function setStatus(text,type=''){statusEl.className='status '+type;statusEl.textContent=text}
    function render(data){lastResult=data;summary.hidden=false;summary.innerHTML=`<h2>${esc(data.company_name)} <small>${esc(data.stock_code)}</small></h2><div>${esc(data.summary)}</div><div class="toolbar"><button id="download">下载JSON</button><button id="print">打印/另存PDF</button></div>`;document.getElementById('download').onclick=download;document.getElementById('print').onclick=()=>window.print();const byNumber=new Map(data.answers.map(x=>[x.number,x]));let html='',current='';for(const q of questions){if(q.module!==current){if(current)html+='</section>';current=q.module;html+=`<section class="module"><h3>${esc(current)}</h3>`}const a=byNumber.get(q.number)||{};html+=`<div class="row"><div class="num">${q.number}</div><div class="question">${esc(q.question)}<div class="empty">选项：${esc(q.allowed_answer)}</div></div><div class="answer">${esc(a.answer||'未生成')}${a.requires_user_confirmation?'<div class="confirm">需要你本人确认</div>':''}</div><div class="evidence">${esc(a.evidence||'')}</div><div class="confidence">${esc(a.confidence||'低')}</div></div>`}if(current)html+='</section>';results.innerHTML=html;risk.hidden=false;risk.textContent=data.risk_notice||'研究结果仅供参考，不构成投资建议。'}
    function renderHistory(items){historyCount.textContent=`（${items.length}份）`;if(!items.length){historyList.innerHTML='<div class="history-empty">还没有历史记录。生成第一份报告后会自动保存在这里。</div>';return}historyList.innerHTML=items.map(item=>`<div class="history-item"><div><div class="history-name">${esc(item.company_name)} · ${esc(item.stock_code)}</div><div class="history-meta">研究日期：${esc(item.as_of||'未知')}</div></div><div class="history-meta">生成时间：${esc((item.generated_at||'').replace('T',' '))}<br>模型：${esc(item.model)}</div><div class="history-actions"><button class="open-history" data-id="${esc(item.id)}">打开（免费）</button><button class="rerun" data-code="${esc(item.stock_code)}">重新生成（收费）</button></div></div>`).join('')}
    async function loadHistory(){try{const data=await fetch('/api/research/history',{cache:'no-store'}).then(readJson);renderHistory(data.items||[])}catch(error){historyList.innerHTML=`<div class="history-empty">历史记录读取失败：${esc(error.message)}</div>`}}
    async function openHistory(id){setStatus('正在打开本地历史记录…','running');try{const data=await fetch('/api/research/history/item?id='+encodeURIComponent(id),{cache:'no-store'}).then(readJson);render(data);code.value=data.stock_code||'';setStatus(`已打开历史记录：${data.company_name}（未调用API、未产生费用）`,'ok')}catch(error){setStatus(error.message,'error')}}
    async function rerun(stockCode){if(!confirm(`重新生成 ${stockCode} 会调用 OpenAI API 并产生费用，确定继续吗？`))return;code.value=stockCode;await run(true)}
    function download(){if(!lastResult)return;const blob=new Blob([JSON.stringify(lastResult,null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${lastResult.stock_code}_48项公司研究.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    async function run(force=false){const value=code.value.trim();if(!value){setStatus('请先输入股票代码','error');return}analyze.disabled=true;setStatus(force?'正在重新生成，将产生API费用…':'正在查找本地历史记录…','running');summary.hidden=true;results.innerHTML='';risk.hidden=true;try{const response=await fetch('/api/research/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:value,force})});const data=await readJson(response);render(data);if(data.from_cache)setStatus(`已打开最近历史记录：${data.company_name}（未调用API、未产生费用）`,'ok');else{setStatus(`已完成：${data.company_name}（${data.stock_code}）· 已保存到本机历史记录`,'ok');await loadHistory()}}catch(error){setStatus(error.message,'error')}finally{analyze.disabled=false}}
    async function init(){try{const [s,q]=await Promise.all([fetch('/api/research/status',{cache:'no-store'}).then(readJson),fetch('/api/research/questions',{cache:'no-store'}).then(readJson)]);questions=q.questions;if(!s.api_key_configured)setStatus('尚未设置 OPENAI_API_KEY。历史记录仍可免费打开；重新生成需要设置密钥。','error');else setStatus(`服务就绪 · 模型：${s.model}`,'ok');await loadHistory()}catch(error){setStatus('初始化失败：'+error.message,'error')}}
    analyze.onclick=()=>run(false);code.addEventListener('keydown',e=>{if(e.key==='Enter')run(false)});refreshHistory.onclick=loadHistory;historyList.addEventListener('click',e=>{const open=e.target.closest('.open-history'),rerunButton=e.target.closest('.rerun');if(open)openHistory(open.dataset.id);if(rerunButton)rerun(rerunButton.dataset.code)});init();
  </script>
</body>
</html>
