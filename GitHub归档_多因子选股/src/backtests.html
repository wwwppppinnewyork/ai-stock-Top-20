<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>历史回测中心</title>
  <style>
    :root{--forest:#123e34;--forest2:#1d5c4b;--paper:#f4f1e9;--card:#fffdf8;--line:#d9ddd5;--muted:#596760;--orange:#e97b42;--mint:#dcebe4;--ink:#14231e}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei UI","PingFang SC",sans-serif}.shell{width:min(1180px,calc(100% - 40px));margin:auto}
    nav{position:sticky;top:0;z-index:10;background:#f4f1e9ee;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}nav .shell{height:64px;display:flex;align-items:center;justify-content:space-between}.brand,.home{color:var(--forest);font-weight:900;text-decoration:none}.home{padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:#fff}
    header{background:var(--forest);color:white;padding:48px 0}h1{margin:0;font-size:clamp(34px,5vw,58px);letter-spacing:-.04em}header p{margin:12px 0 0;color:#d5e4df;font-weight:700}
    main{padding:28px 0 56px}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:18px}.toolbar h2{margin:0;font-size:24px}.toolbar p{margin:4px 0 0;color:var(--muted);font-weight:700;font-size:13px}input{width:min(360px,100%);height:44px;border:1px solid var(--line);border-radius:13px;padding:0 15px;background:white;font:inherit;font-weight:800;outline:none}input:focus{border-color:var(--forest2);box-shadow:0 0 0 4px #1d5c4b16}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:92px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;transition:.18s}.card:hover{transform:translateY(-2px);border-color:#aebeb5;box-shadow:0 10px 25px #16352a12}.icon{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--forest);font-size:12px;font-weight:900}.card strong{display:block;font-size:16px}.card small{display:block;margin-top:4px;color:var(--muted);font-weight:700;line-height:1.4}.go{color:var(--forest2);font-size:20px}.section{margin:30px 0 13px;font-size:19px}.empty{display:none;padding:34px;text-align:center;color:var(--muted)}
    @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{width:min(100% - 24px,1180px)}.toolbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}input{width:100%}}
  </style>
</head>
<body>
  <nav><div class="shell"><a class="brand" href="/">多因子选股 · 回测中心</a><a class="home" href="/">← 返回首页</a></div></nav>
  <header><div class="shell"><h1>历史回测</h1><p>Top5、Top10周频策略与沪深300同期表现对比</p></div></header>
  <main class="shell">
    <div class="toolbar"><div><h2>回测报告</h2><p>先看跨年度累计表现，再按年份查看明细</p></div><input id="search" type="search" placeholder="搜索年份、Top5或Top10" aria-label="搜索回测报告"></div>
    <h2 class="section">跨年度累计回测</h2><div id="longterm" class="grid"></div>
    <h2 class="section">年度回测</h2><div id="annual" class="grid"></div>
    <div id="empty" class="empty">没有找到对应回测报告。</div>
  </main>
  <script>
    const reports=[
      {group:'longterm',icon:'L10',title:'2016—2026年Top10累计回测',note:'Top10净值、沪深300及年度对比',href:'/2016年至2026年TOP10累计回测.html'},
      {group:'longterm',icon:'L5',title:'2016—2026年Top5累计回测',note:'Top5净值、沪深300及年度对比',href:'/2016年至2026年TOP5累计回测.html'}
    ];
    for(let year=2026;year>=2016;year--){for(const top of [10,5])reports.push({group:'annual',icon:String(year).slice(2)+(top===5?'5':''),title:`${year}年Top${top}周频回测`,note:`Top${top}等权策略与沪深300同期表现`,href:year===2026?`/top${top}_backtest.html`:`/${year}年周频回测TOP${top}.html`})}
    const card=r=>`<a class="card" data-text="${r.title.toLowerCase()}" href="${r.href}"><span class="icon">${r.icon}</span><span><strong>${r.title}</strong><small>${r.note}</small></span><span class="go">→</span></a>`;
    function render(q=''){const filtered=reports.filter(r=>r.title.toLowerCase().includes(q.toLowerCase()));document.getElementById('longterm').innerHTML=filtered.filter(r=>r.group==='longterm').map(card).join('');document.getElementById('annual').innerHTML=filtered.filter(r=>r.group==='annual').map(card).join('');document.getElementById('empty').style.display=filtered.length?'none':'block'}
    document.getElementById('search').addEventListener('input',e=>render(e.target.value.trim()));render();
  </script>
</body>
</html>
